<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Althaf S — Full Stack Developer crafting exceptional digital experiences. Explore my portfolio of modern web applications and get in touch."
    />
    <meta
      name="keywords"
      content="developer, portfolio, web development, full stack, react, javascript, python"
    />
    <meta name="author" content="Althaf S" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Althaf S | Full Stack Developer</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio_theme') || localStorage.getItem('theme') || 'dark-red';
          document.documentElement.setAttribute('data-theme', saved);
          if (saved === 'dark-red') {
            document.documentElement.classList.add('dark', 'dark-theme', 'theme-dark-red');
          } else {
            document.documentElement.classList.add('light', 'light-theme', 'theme-light-blue');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <main style="min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at center,rgba(79,140,255,.22),#050505 68%);color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;padding:24px;">
        <div>
          <h1 style="font-size:clamp(48px,10vw,120px);line-height:1;margin:0 0 20px;">Althaf S</h1>
          <p style="max-width:680px;margin:0 auto;color:#d7dce8;font-size:18px;">Full Stack Developer portfolio is loading.</p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
